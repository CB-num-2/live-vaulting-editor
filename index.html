        // --- DASHBOARD ACTIONS PIPELINE ---
        function navigateToSettings() {
            state.currentView = 'SETTINGS';
            renderSettingsView();
        }

        function returnToDashboardHome() {
            clearTimeout(state.autoSaveTimer);
            commitStateToDisk();
            state.currentView = 'HOME';
            renderDashboardView();
        }

        function openProjectWorkspace(id) {
            state.activeProjectId = id;
            const project = state.projects[id];
            state.activeFileName = Object.keys(project.files)[0] || null;
            state.currentView = 'EDITOR';
            renderEditorWorkspaceView();
        }

        function createNewProjectDashboardAction() {
            const title = prompt("Enter explicit name tag descriptive identifier for container project repository:");
            if (!title || title.trim() === "") return;

            const generatedId = 'project-' + Date.now();
            state.projects[generatedId] = {
                id: generatedId,
                name: title.trim(),
                files: { ...defaultProjectFiles },
                updatedAt: new Date().toISOString()
            };
            commitStateToDisk();
            renderDashboardView();
            triggerToast('Initialized sandbox cluster workspace structure context');
        }

        function renameProjectDashboardAction(id) {
            const currentName = state.projects[id].name;
            const newName = prompt(`Enter new structural assignment title name for context project "${currentName}":`, currentName);
            if (!newName || newName.trim() === "" || newName.trim() === currentName) return;

            state.projects[id].name = newName.trim();
            state.projects[id].updatedAt = new Date().toISOString();
            commitStateToDisk();
            renderDashboardView();
            triggerToast('Re-assigned targeted repository container tags');
        }

        function deleteProjectDashboardAction(id) {
            if (!confirm(`Are you absolutely sure you want to permanently clear project "${state.projects[id].name}" from browser environment local storage layers?`)) return;

            delete state.projects[id];
            commitStateToDisk();
            renderDashboardView();
            triggerToast('Purged structural profile completely from disk index layers', 'warn');
        }

            state.settings.liveUpdateInterval = parseInt(document.getElementById('setting-live-interval').value, 10);

            triggerToast('Global parameters synced clean');
            returnToDashboardHome();
        }

                </header>

                <!-- WORKSPACE STRUCTURAL CENTER DIVISION -->

                    <!-- REPOSITORY INTEGRATED MULTI-LEVEL MANAGER -->

                                    <textarea id="sandbox-ide-textarea" oninput="handleWorkspaceTextareaModification(this)" onkeydown="interceptKeystrokeActions(event, this)" onscroll="syncGutterRailScroll(this)" class="w-full h-full bg-transparent text-zinc-300 p-3 pt-3 font-mono focus:outline-none resize-none leading-6 whitespace-pre overflow-x-auto overflow-y-auto selection:bg-zinc-800" style="font-size: ${state.settings.editorFontSize};" spellcheck="false" placeholder="Enter clean standard multi-file source block configurations...">${currentCodeText}</textarea>

        // --- FILE-MOVING & PATH REFACTORS ENGINE ---
        function triggerFileMovingWorkflowPrompt() {
            if (!state.activeFileName) return;
            const originalPath = state.activeFileName;
            const targetPathInput = prompt(`Enter new absolute path for the targeted node location context [Current: "${originalPath}"]:`, originalPath);
            
            if (!targetPathInput || targetPathInput.trim() === "" || targetPathInput.trim() === originalPath) return;
            const normalizedTarget = targetPathInput.trim();
            const project = state.projects[state.activeProjectId];

            if (project.files[normalizedTarget]) {
                alert("ConflictException. A structural element or index signature is already registered at that path identifier destination.");
                return;
            }

            // Transfer block data context cleanly across pointer frames
            const bufferedContent = project.files[originalPath];
            project.files[normalizedTarget] = bufferedContent;
            delete project.files[originalPath];

            // Re-expand target path folder tracks dynamically
            const elements = normalizedTarget.split('/');
            let recursiveString = '';
            for(let i=0; i < elements.length - 1; i++) {
                recursiveString = recursiveString ? `${recursiveString}/${elements[i]}` : elements[i];
                state.expandedFolders[recursiveString] = true;
            }

            commitStateToDisk();
            state.activeFileName = normalizedTarget;
            renderEditorWorkspaceView();
            triggerToast('Refactored operational path hierarchy tracks cleanly');
        }

        // --- SUB-ROUTINE: RECURSIVE ARCHITECTURE PATH BUILDER FOR NESTED FOLDERS ---
        function compileFileSystemLayoutView(flatFilesMap) {
            const structure = {};
            
            Object.keys(flatFilesMap).forEach(path => {
                const elements = path.split('/');
                let pointer = structure;
                
                for (let i = 0; i < elements.length; i++) {
                    const segment = elements[i];
                    if (i === elements.length - 1) {
                        pointer[segment] = { __isFile: true, fullPath: path };
                    } else {
                        if (!pointer[segment]) pointer[segment] = {};
                        pointer = pointer[segment];
                    }
                }
            });

            function traceNodeHierarchy(node, currentPrefix = '') {
                let segmentHTML = '';
                const keys = Object.keys(node).sort((a, b) => {
                    const aIsFile = node[a].__isFile === true;
                    const bIsFile = node[b].__isFile === true;
                    if (aIsFile !== bIsFile) return aIsFile ? 1 : -1;
                    return a.localeCompare(b);
                });

                keys.forEach(key => {
                    if (key === '__isFile' || key === 'fullPath') return;
                    
                    const item = node[key];
                    if (item.__isFile) {
                        const isMainEntry = item.fullPath === 'index.html';
                        const isSelected = item.fullPath === state.activeFileName;
                        
                        segmentHTML += `
                            <div class="group flex items-center justify-between px-2 py-1.5 rounded-lg text-xs cursor-pointer transition ${
                                isSelected ? 'bg-zinc-800 text-zinc-100 font-semibold border border-zinc-700/30' : 'text-zinc-400 hover:bg-zinc-900/60 hover:text-zinc-200'
                            }" onclick="openFileTarget('${item.fullPath}')" style="padding-left: ${Math.max(8, currentPrefix.split('/').length * 8)}px">
                                <div class="flex items-center gap-2 truncate pr-2">
                                    <span class="text-zinc-500 group-hover:text-emerald-400 transition text-[11px]">${isSelected ? '⚡' : '📄'}</span>
                                    <span class="truncate">${key}</span>
                                    ${isMainEntry ? '<span class="text-[8px] bg-zinc-950 px-1 border border-zinc-800 rounded font-bold text-zinc-500 scale-90">main</span>' : ''}
                                </div>
                                <button onclick="purgeSpecifiedFile(event, '${item.fullPath}')" class="opacity-0 group-hover:opacity-100 p-0.5 rounded text-zinc-500 hover:text-rose-400 transition" title="Delete file node">
                                    ✕
                                </button>
                            </div>
                        `;
                    } else {
                        const folderPath = currentPrefix ? `${currentPrefix}/${key}` : key;
                        const isExpanded = state.expandedFolders[folderPath] === true;
                        
                        segmentHTML += `
                            <div class="space-y-0.5">
                                <div class="flex items-center justify-between px-2 py-1.5 rounded-lg text-xs cursor-pointer text-zinc-300 hover:bg-zinc-900/40" onclick="toggleFolderExpansionState('${folderPath}')" style="padding-left: ${Math.max(8, currentPrefix.split('/').length * 8)}px">
                                    <div class="flex items-center gap-2 font-medium">
                                        <span class="text-zinc-400">${isExpanded ? '▼' : '▶'}</span>
                                        <span class="text-amber-400/80">📁</span>
                                        <span class="truncate text-zinc-200">${key}</span>
                                    </div>
                                </div>
                                <div class="${isExpanded ? 'block' : 'hidden'}">
                                    ${traceNodeHierarchy(item, folderPath)}
                                </div>
                            </div>
                        `;
                    }
                });

                return segmentHTML;
            }

            return traceNodeHierarchy(structure);
        }

        // --- SUB-ROUTINE: COMPILATION & POSITIONING ENGINE FOR AUTOCOMPLETE ---
        function handleWorkspaceTextareaModification(textarea) {
            updateWorkspaceLineCounters();
            
            const cursorPosition = textarea.selectionStart;
            const textValue = textarea.value;
            
            const textBoundary = textValue.substring(0, cursorPosition);
            const lineTokens = textBoundary.split(/[\s,;<>'"\(\)]/);
            const activeToken = lineTokens[lineTokens.length - 1];

            state.projects[state.activeProjectId].files[state.activeFileName] = textValue;
            evaluateLiveAutoSaveTriggers();

            if (!activeToken || activeToken.length < 1) {
                hideSuggestionPanelBox();
                return;
            }

            const filteredMatches = state.autocomplete.suggestions.filter(term => 
                term.toLowerCase().startsWith(activeToken.toLowerCase()) && term.toLowerCase() !== activeToken.toLowerCase()
            );

            if (filteredMatches.length > 0) {
                state.autocomplete.filtered = filteredMatches;
                state.autocomplete.query = activeToken;
                state.autocomplete.activeIndex = Math.min(state.autocomplete.activeIndex, filteredMatches.length - 1);
                displaySuggestionPanelBox(textarea);
            } else {
                hideSuggestionPanelBox();
            }
        }

        function displaySuggestionPanelBox(textarea) {
            const panel = document.getElementById('autocomplete-suggestion-box');
            if (!panel) return;

            state.autocomplete.visible = true;
            panel.innerHTML = state.autocomplete.filtered.map((term, index) => {
                const isActiveSelection = index === state.autocomplete.activeIndex;
                return `
                    <div class="px-3 py-1 cursor-pointer transition text-xs font-mono flex items-center justify-between ${
                        isActiveSelection ? 'bg-emerald-500 text-zinc-950 font-bold' : 'text-zinc-300 hover:bg-zinc-800'
                    }" onclick="commitSelectedAutoCompleteToken('${term}')">
                        <span>${term}</span>
                        <span class="text-[9px] opacity-60">${isActiveSelection ? '⏎' : 'tab'}</span>
                    </div>
                `;
            }).join('');

            panel.classList.remove('hidden');
            panel.style.bottom = "24px";
            panel.style.left = "24px";
        }

        function hideSuggestionPanelBox() {
            state.autocomplete.visible = false;
            const panel = document.getElementById('autocomplete-suggestion-box');
            if (panel) panel.classList.add('hidden');
        }

        function commitSelectedAutoCompleteToken(word) {
            const textarea = document.getElementById('sandbox-ide-textarea');
            if (!textarea) return;

            const currentPos = textarea.selectionStart;
            const baseText = textarea.value;
            
            const replacementOffset = state.autocomplete.query.length;
            const outputText = baseText.substring(0, currentPos - replacementOffset) + word + baseText.substring(currentPos);
            
            textarea.value = outputText;
            state.projects[state.activeProjectId].files[state.activeFileName] = outputText;
            commitStateToDisk();
            
            const postSelectionIndex = currentPos - replacementOffset + word.length;
            textarea.setSelectionRange(postSelectionIndex, postSelectionIndex);
            
            hideSuggestionPanelBox();
            updateWorkspaceLineCounters();
            textarea.focus();
        }

        function interceptKeystrokeActions(e, textarea) {
            if (state.autocomplete.visible) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    state.autocomplete.activeIndex = (state.autocomplete.activeIndex + 1) % state.autocomplete.filtered.length;
                    displaySuggestionPanelBox(textarea);
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    state.autocomplete.activeIndex = (state.autocomplete.activeIndex - 1 + state.autocomplete.filtered.length) % state.autocomplete.filtered.length;
                    displaySuggestionPanelBox(textarea);
                    return;
                }
                if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    const chosenWord = state.autocomplete.filtered[state.autocomplete.activeIndex];
                    if (chosenWord) {
                        commitSelectedAutoCompleteToken(chosenWord);
                    }
                    return;
                }
                if (e.key === 'Escape') {
                    hideSuggestionPanelBox();
                    return;
                }
            }
            
            if (e.key === 'Tab') {
                e.preventDefault();
                const pos = textarea.selectionStart;
                const value = textarea.value;
                const spacer = " ".repeat(state.settings.tabSize);
                textarea.value = value.substring(0, pos) + spacer + value.substring(pos);
                textarea.selectionStart = textarea.selectionEnd = pos + state.settings.tabSize;
                handleWorkspaceTextareaModification(textarea);
            }
        }

        // --- SUB-ROUTINE: TEXTAREA LINE COUNT RAILS AND AUTO-SAVE INTERVALS ---
        function updateWorkspaceLineCounters() {
            const textarea = document.getElementById('sandbox-ide-textarea');
            const rail = document.getElementById('line-counter-rail');
            if (!textarea || !rail) return;

            const totalCount = textarea.value.split('\n').length;
            let outputRows = '';
            for (let i = 1; i <= totalCount; i++) {
                outputRows += i + '<br>';
            }
            rail.innerHTML = outputRows;
        }

        function syncGutterRailScroll(textarea) {
            const rail = document.getElementById('line-counter-rail');
            if (rail) rail.scrollTop = textarea.scrollTop;
        }

        function evaluateLiveAutoSaveTriggers() {
            const targetBadge = document.getElementById('save-indicator-badge');
            if (targetBadge) {
                targetBadge.innerText = 'Pending local disk flash pass...';
                targetBadge.className = 'text-[10px] text-amber-500 font-mono';
            }

            clearTimeout(state.autoSaveTimer);
            // DYNAMICALLY RESOLVED AUTO-SAVE THROTTLE DEBOUNCE INTERVAL RANGE VALUE FROM STATE PROPERTIES
            state.autoSaveTimer = setTimeout(() => {
                commitStateToDisk();
                state.lastSaveTime = new Date().toLocaleTimeString();
                
                const verifiedBadge = document.getElementById('save-indicator-badge');
                if (verifiedBadge) {
                    verifiedBadge.innerText = `Auto-saved at ${state.lastSaveTime}`;
                    verifiedBadge.className = 'text-[10px] text-emerald-400 font-mono';
                }
            }, state.settings.liveUpdateInterval);
        }

        // --- WORKSPACE DIRECT FILE / DIRECTORY CONTROLS ---
        function toggleFolderExpansionState(path) {
            state.expandedFolders[path] = !state.expandedFolders[path];
            renderEditorWorkspaceView();
        }

        function openFileTarget(path) {
            state.activeFileName = path;
            hideSuggestionPanelBox();
            renderEditorWorkspaceView();
        }

        function triggerFileCreationPrompt() {
            const targetedPathInput = prompt("Enter complete multi-tier file pathway string context destination targets (e.g. assets/styles.css, layout/sidebar/nav.html):");
            if (!targetedPathInput || targetedPathInput.trim() === "") return;

            const targetPath = targetedPathInput.trim();
            const projectFiles = state.projects[state.activeProjectId].files;

            if (projectFiles[targetPath]) {
                alert("ConflictException. A directory file path component matching that designation index string exists.");
                return;
            }

            const formatExtension = targetPath.split('.').pop().toLowerCase();
            let bodyStub = `/* Module Code Space */`;
            if (formatExtension === 'html' || formatExtension === 'htm') {
                bodyStub = `<!-- Component UI Node Segment -->\n<div class="component-root">\n    \n</div>`;
            } else if (formatExtension === 'json') {
                bodyStub = `{\n  "status": "active"\n}`;
            }

            const segments = targetPath.split('/');
            let routeTracking = '';
            for (let i = 0; i < segments.length - 1; i++) {
                routeTracking = routeTracking ? `${routeTracking}/${segments[i]}` : segments[i];
                state.expandedFolders[routeTracking] = true;
            }

            projectFiles[targetPath] = bodyStub;
            commitStateToDisk();
            state.activeFileName = targetPath;
            renderEditorWorkspaceView();
            triggerToast(`Created pathway reference target node cleanly`);
        }

        function purgeSpecifiedFile(e, path) {
            e.stopPropagation();
            if (!confirm(`Are you certain you want to remove "${path}" node mappings from project tree arrays?`)) return;

            delete state.projects[state.activeProjectId].files[path];
            commitStateToDisk();

            if (state.activeFileName === path) {
                const remaining = Object.keys(state.projects[state.activeProjectId].files);
                state.activeFileName = remaining.length > 0 ? remaining[0] : null;
            }
            renderEditorWorkspaceView();
            triggerToast('Dropped pathway assignment item index parameters', 'info');
        }

        // --- SUB-ROUTINE: RUN CONSOLE DROPDOWN CONTROLLERS ---
        function toggleRuntimeOptionDropdown(e) {
            e.stopPropagation();
            state.isRunDropdownOpen = !state.isRunDropdownOpen;
            const panel = document.getElementById('execution-dropdown-panel');
            if (panel) {
                if (state.isRunDropdownOpen) {
                    panel.classList.remove('hidden', 'scale-95', 'opacity-0');
                    panel.classList.add('block', 'scale-100', 'opacity-100');
                } else {
                    panel.classList.remove('block', 'scale-100', 'opacity-100');
                    panel.classList.add('hidden', 'scale-95', 'opacity-0');
                }
            }
        }

        window.addEventListener('click', () => {
            if (state.isRunDropdownOpen) {
                state.isRunDropdownOpen = false;
                const panel = document.getElementById('execution-dropdown-panel');
                if (panel) {
                    panel.classList.remove('block', 'scale-100', 'opacity-100');
                    panel.classList.add('hidden', 'scale-95', 'opacity-0');
                }
            }
        });

        function triggerRuntimePipeline(profile) {
            commitStateToDisk();
            
            const currentHostOrigin = window.location.origin + window.location.pathname;
            let setupRouteString = `run?=t,project=${state.activeProjectId}`;

            if (profile === 'RELOAD_WITH_TOOLS') {
                setupRouteString += `,tools=true`;
            } else if (profile === 'LIVE') {
                setupRouteString += `,live=true`;
            } else if (profile === 'LIVE_WITH_TOOLS') {
                setupRouteString += `,tools=true,live=true`;
            }

            const launchLink = `${currentHostOrigin}#${setupRouteString}`;
            const operationalWindowProperties = "width=1100,height=800,menubar=no,status=no,toolbar=no,location=no,scrollbars=yes,resizable=yes";
            
            const runtimePopupPointer = window.open(launchLink, `Engine_Sandbox_Instance_${state.activeProjectId}_${profile}`, operationalWindowProperties);
            
            if (runtimePopupPointer) {
                triggerToast(`Launched target pipeline context popup stream`);
            } else {
                triggerToast('Popup frame blocked by client application safety preferences', 'warn');
            }
        }

        // ---獨立運行渲染程序 (STANDALONE RUNTIME VIEWPORT ENGINE) ---
        function renderStandAloneRuntimeView(projectId, isLive, withTools) {
            const root = document.getElementById('app-root');
            
            function fetchFreshStoragePayload() {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    try { return JSON.parse(raw); } catch (e) {}
                }
                return null;
            }

            const activeDataset = fetchFreshStoragePayload();
            const project = activeDataset ? activeDataset[projectId] : null;

            if (!project) {
                root.className = "w-full h-screen flex flex-col items-center justify-center bg-zinc-950 p-6 text-center font-mono";
                root.innerHTML = `
                    <div class="text-zinc-600 text-4xl mb-2">⚠️</div>
                    <h1 class="text-sm font-bold text-zinc-300">Isolated Virtual Project Framework Scope Absent</h1>
                    <p class="text-xs text-zinc-500 mt-2 max-w-sm">The cluster token reference pointer link cannot locate local storage definitions.</p>
                `;
                return;
            }

            root.className = "w-full h-screen flex flex-row bg-black overflow-hidden font-mono text-xs select-none";
            root.innerHTML = `
                <!-- SANDBOX MAIN RENDER CORE WINDOW IFRAME -->
                <div class="flex-1 h-full flex flex-col relative bg-zinc-900">
                    <iframe id="isolated-runtime-canvas" class="w-full h-full bg-white" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>

                <!-- DIAGNOSTIC PANE OVERLAY SIDEBAR -->
                ${withTools ? `
                    <div class="w-80 h-full border-l border-zinc-900 bg-zinc-950 flex flex-col shrink-0">
                        <div class="p-3.5 border-b border-zinc-900 flex items-center justify-between bg-zinc-900/40">
                            <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-1.5">
                                <span>🛠️</span> System Inspector Tools
                            </span>
                            <span class="text-[9px] bg-zinc-900 px-2 py-0.5 rounded text-zinc-500 border border-zinc-800">OK</span>
                        </div>
                        <div class="p-4 flex-1 overflow-y-auto space-y-5">
                            <div class="space-y-2">
                                <span class="text-[10px] font-bold uppercase text-zinc-500 tracking-wider">Active Pipeline Bundle</span>
                                <div class="bg-zinc-900/60 border border-zinc-900 rounded-xl p-3 space-y-2 text-[11px]">
                                    <div class="flex justify-between"><span class="text-zinc-500">Repository Name:</span><span class="text-zinc-300 font-medium truncate max-w-[140px]">${project.name}</span></div>
                                    <div class="flex justify-between"><span class="text-zinc-500">I/O Link Stream:</span><span class="text-emerald-400">${isLive ? 'Reactive Buffer' : 'Static Load'}</span></div>
                                    <div class="flex justify-between"><span class="text-zinc-500">Index Target:</span><span class="text-zinc-400">index.html</span></div>
                                </div>
                            </div>

                            <div class="space-y-2 flex-1 flex flex-col min-h-[300px]">
                                <span class="text-[10px] font-bold uppercase text-zinc-500 tracking-wider">Virtual Channel Telemetry</span>
                                <div id="diagnostic-runtime-logs" class="bg-zinc-900/30 border border-zinc-900 rounded-xl p-3 flex-1 text-[10px] text-zinc-500 overflow-y-auto space-y-1.5 font-mono">
                                    <div>[00:00:01] System execution pipeline linked cleanly...</div>
                                    <div class="text-emerald-500/80">[00:00:01] Virtual window DOM environment mapping established.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;

            const viewPortFrame = document.getElementById('isolated-runtime-canvas');

            function executeRenderPipeline() {
                const refreshedState = fetchFreshStoragePayload();
                if (!refreshedState || !refreshedState[projectId]) return;
                
                const datasetFiles = refreshedState[projectId].files;
                let primaryHTMLCode = datasetFiles['index.html'] || '<h3>Missing index.html configuration profiles</h3>';

                Object.keys(datasetFiles).forEach(filepath => {
                    if (filepath === 'index.html') return;

                    if (filepath.endsWith('.js')) {
                        const escapedPath = filepath.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const searchRegex = new RegExp(`src=["']${escapedPath}["']`, 'g');
                        primaryHTMLCode = primaryHTMLCode.replace(searchRegex, `src="data:text/javascript;base64,${btoa(unescape(encodeURIComponent(datasetFiles[filepath])))}"`);
                    }
                    if (filepath.endsWith('.css')) {
                        const escapedPath = filepath.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const searchRegex = new RegExp(`href=["']${escapedPath}["']`, 'g');
                        primaryHTMLCode = primaryHTMLCode.replace(searchRegex, `href="data:text/css;base64,${btoa(unescape(encodeURIComponent(datasetFiles[filepath])))}"`);
                    }
                });

                if (isLive) {
                    const logsFrame = document.getElementById('diagnostic-runtime-logs');
                    if (logsFrame) {
                        const timeStamp = new Date().toLocaleTimeString();
                        logsFrame.innerHTML += `<div class="text-zinc-400">[${timeStamp}] Hot-swapped modified code buffers seamlessly into DOM.</div>`;
                        logsFrame.scrollTop = logsFrame.scrollHeight;
                    }
                }

                viewPortFrame.srcdoc = primaryHTMLCode;
            }

            executeRenderPipeline();

            if (isLive) {
                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY) executeRenderPipeline();
                });
                window.addEventListener('sandbox_state_mutated_local', () => {
                    executeRenderPipeline();
                });
            }
        }

        // --- LIFE CYCLE BOOTSTRAP INITIALIZATION SUBSYSTEM ---
        window.addEventListener('hashchange', evaluateRouteEnvironment);
        window.addEventListener('load', () => {
            loadApplicationData();
            evaluateRouteEnvironment();
        });
    </script>
</body>
